name: Build PGL Mocap (Windows)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Download MediaPipe models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          foreach ($m in "lite","full","heavy") {
            $url = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task"
            Invoke-WebRequest $url -OutFile "models/pose_landmarker_$m.task"
          }

      - name: Tracking test on a real photo
        shell: pwsh
        run: |
          $urls = @(
            "https://storage.googleapis.com/mediapipe-assets/pose.jpg",
            "https://storage.googleapis.com/mediapipe-tasks/pose_landmarker/pose.jpg",
            "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Usain_Bolt_Rio_100m_final_2016k.jpg/640px-Usain_Bolt_Rio_100m_final_2016k.jpg"
          )
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile test_person.jpg -Headers @{ "User-Agent" = "PGL-Mocap-CI" }; $ok = $true; Write-Host "Photo: $u"; break } catch { Write-Host "skip $u" }
          }
          if (-not $ok) { Write-Error "No test photo available"; exit 1 }
          $env:PYTHONIOENCODING = "utf-8"
          python tools/track_image.py test_person.jpg full

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name "PGL Mocap"
          --icon assets/pgl_mocap.ico
          --add-data "models;models"
          --add-data "assets;assets"
          --collect-all mediapipe
          --collect-all cyndilib
          --collect-submodules pygrabber
          --collect-submodules comtypes
          --hidden-import selftest
          run_pgl_mocap.py

      - name: Self-test
        shell: pwsh
        run: |
          Copy-Item README.md "dist/PGL Mocap/README.md"
          $p = Start-Process -FilePath "dist/PGL Mocap/PGL Mocap.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "dist/PGL Mocap/pgl_mocap_selftest.txt"
          Remove-Item "dist/PGL Mocap/pgl_mocap_selftest.txt"
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit $($p.ExitCode))"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PGL_Mocap_win64
          path: dist/PGL Mocap

      - name: Pack zip
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path "dist/PGL Mocap" -DestinationPath "dist/PGL_Mocap_win64.zip"

      # Готовый архив публикуется в Releases (главная страница репозитория → справа «Releases»)
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path pglmocap/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver-build$env:GITHUB_RUN_NUMBER"
          $notes = "PGL Mocap $ver (сборка $env:GITHUB_RUN_NUMBER).`n`nСкачайте PGL_Mocap_win64.zip, распакуйте и запустите 'PGL Mocap.exe'. Инструкция — README.md внутри архива."
          gh release create $tag "dist/PGL_Mocap_win64.zip" --title "PGL Mocap $ver (сборка $env:GITHUB_RUN_NUMBER)" --notes $notes --latest --target $env:GITHUB_SHA
