name: Build PGL Mocap (Windows + Linux + macOS + Android)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MODEL_URL: https://storage.googleapis.com/mediapipe-models/pose_landmarker
  TEST_PHOTO: https://storage.googleapis.com/mediapipe-assets/pose.jpg
  HAND_MODEL_URL: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
  FACE_MODEL_URL: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Download MediaPipe models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          foreach ($m in "lite","full","heavy") {
            Invoke-WebRequest "$env:MODEL_URL/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task" -OutFile "models/pose_landmarker_$m.task"
          }
          Invoke-WebRequest "$env:HAND_MODEL_URL" -OutFile "models/hand_landmarker.task"
          Invoke-WebRequest "$env:FACE_MODEL_URL" -OutFile "models/face_landmarker.task"

      - name: Tracking test on a real photo
        shell: pwsh
        run: |
          Invoke-WebRequest $env:TEST_PHOTO -OutFile test_person.jpg
          $env:PYTHONIOENCODING = "utf-8"
          python tools/track_image.py test_person.jpg full --hands --face
          Invoke-WebRequest "https://storage.googleapis.com/mediapipe-assets/portrait.jpg" -OutFile portrait.jpg
          python tools/track_image.py portrait.jpg full --face --require-face

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name "PGL Mocap"
          --icon assets/pgl_mocap.ico
          --add-data "models;models"
          --add-data "assets;assets"
          --collect-all mediapipe
          --collect-all cyndilib
          --collect-submodules pygrabber
          --collect-submodules comtypes
          --hidden-import selftest
          run_pgl_mocap.py

      - name: Self-test
        shell: pwsh
        run: |
          Copy-Item README.md "dist/PGL Mocap/README.md"
          $p = Start-Process -FilePath "dist/PGL Mocap/PGL Mocap.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "dist/PGL Mocap/pgl_mocap_selftest.txt"
          Remove-Item "dist/PGL Mocap/pgl_mocap_selftest.txt"
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit $($p.ExitCode))"; exit 1 }

      - name: Pack zip
        shell: pwsh
        run: Compress-Archive -Path "dist/PGL Mocap" -DestinationPath "PGL_Mocap_win64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path pglmocap/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVer=$ver" "/DBuildNum=$env:GITHUB_RUN_NUMBER" installer\pgl_mocap.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item dist\PGL_Mocap_Setup.exe PGL_Mocap_Setup.exe
          Get-Item PGL_Mocap_Setup.exe | Format-List Name, Length

      - name: Test installer (silent install, self-test, firewall, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process PGL_Mocap_Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon,firewall","/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 30; exit 1 }
          $app = "$env:ProgramFiles\PGL Mocap"
          if (-not (Test-Path "$app\PGL Mocap.exe")) { Write-Error "exe not installed"; exit 1 }
          if (-not (Test-Path "$env:PUBLIC\Desktop\PGL Mocap.lnk")) { Write-Error "desktop shortcut missing"; exit 1 }
          $rules = netsh advfirewall firewall show rule name="PGL Mocap"
          $rules | Select-String "Direction|Action|Program"
          if (-not ($rules -match "Allow")) { Write-Error "firewall rule missing"; exit 1 }
          $t = Start-Process "$app\PGL Mocap.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$app\pgl_mocap_selftest.txt"
          if ($t.ExitCode -ne 0) { Write-Error "installed self-test failed"; exit 1 }
          Remove-Item "$app\pgl_mocap_selftest.txt"
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep 5
          if (Test-Path "$app\PGL Mocap.exe") { Write-Error "uninstall left files"; exit 1 }
          $left = netsh advfirewall firewall show rule name="PGL Mocap"
          if ($left -match "Allow") { Write-Error "firewall rule not removed"; exit 1 }
          Write-Host "Installer test OK"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: PGL_Mocap_win64
          path: |
            PGL_Mocap_win64.zip
            PGL_Mocap_Setup.exe

  # ------------------------------------------------------------------ Linux
  linux:
    # Собираем на Ubuntu 22.04: программа запустится на Ubuntu 22.04+, Debian 12+, Mint 21+ и т.п.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 libgles2 avahi-daemon

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Download MediaPipe models
        run: |
          mkdir -p models
          for m in lite full heavy; do
            curl -fsSL -o "models/pose_landmarker_$m.task" "$MODEL_URL/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task"
          done
          curl -fsSL -o models/hand_landmarker.task "$HAND_MODEL_URL"
          curl -fsSL -o models/face_landmarker.task "$FACE_MODEL_URL"

      - name: Tracking test on a real photo
        run: |
          curl -fsSL -o test_person.jpg "$TEST_PHOTO"
          python tools/track_image.py test_person.jpg full --hands --face
          curl -fsSL -o portrait.jpg "https://storage.googleapis.com/mediapipe-assets/portrait.jpg"
          python tools/track_image.py portrait.jpg full --face --require-face

      - name: Unit tests (Live Link output)
        run: |
          python tests/test_livelink.py
          python tests/test_extras_output.py

      - name: GUI smoke test
        run: |
          cat > gui_smoke.py <<'EOF'
          import tkinter as tk
          from pglmocap.gui import App
          root = tk.Tk()
          App(root)
          root.after(1500, root.destroy)
          root.mainloop()
          print("GUI OK")
          EOF
          xvfb-run -a python gui_smoke.py

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name "PGL Mocap"
          --add-data "models:models"
          --add-data "assets:assets"
          --collect-all mediapipe
          --collect-all cyndilib
          --hidden-import selftest
          run_pgl_mocap.py

      - name: Self-test
        run: |
          cp README.md "dist/PGL Mocap/README.md"
          cp tools/install_linux.sh "dist/PGL Mocap/"
          xvfb-run -a "dist/PGL Mocap/PGL Mocap" --selftest; rc=$?
          cat "dist/PGL Mocap/pgl_mocap_selftest.txt"
          rm "dist/PGL Mocap/pgl_mocap_selftest.txt"
          exit $rc

      - name: Pack tar.gz
        run: tar -C dist -czf PGL_Mocap_linux_x64.tar.gz "PGL Mocap"

      - uses: actions/upload-artifact@v4
        with:
          name: PGL_Mocap_linux_x64
          path: PGL_Mocap_linux_x64.tar.gz

  # ------------------------------------------------------------------ Android
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download MediaPipe models
        run: |
          mkdir -p android/app/src/main/assets
          for m in lite full; do
            curl -fsSL -o "android/app/src/main/assets/pose_landmarker_$m.task" "$MODEL_URL/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task"
          done

      - name: Unit tests (same output as desktop version)
        run: gradle -p android --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          gradle -p android --no-daemon assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk PGL_Mocap_android.apk
          echo "--- APK:"; ls -la PGL_Mocap_android.apk
          unzip -l PGL_Mocap_android.apk | grep -E "\.task|arm64-v8a/.*mediapipe|AndroidManifest"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs PGL_Mocap_android.apk | head -3 || true
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"/aapt dump badging PGL_Mocap_android.apk | grep -E "^package|sdkVersion|uses-permission" || true

      - uses: actions/upload-artifact@v4
        with:
          name: PGL_Mocap_android
          path: PGL_Mocap_android.apk

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports

  # ------------------------------------------------------------------ Android: запуск в эмуляторе
  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download MediaPipe models
        run: |
          mkdir -p android/app/src/main/assets
          for m in lite full; do
            curl -fsSL -o "android/app/src/main/assets/pose_landmarker_$m.task" "$MODEL_URL/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task"
          done

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash android/ci/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-result
          path: |
            emulator_screen.png
            logcat.txt
            udp.log

  # ------------------------------------------------------------------ macOS (Apple Silicon)
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Download MediaPipe models
        run: |
          mkdir -p models
          for m in lite full heavy; do
            curl -fsSL -o "models/pose_landmarker_$m.task" "$MODEL_URL/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task"
          done
          curl -fsSL -o models/hand_landmarker.task "$HAND_MODEL_URL"
          curl -fsSL -o models/face_landmarker.task "$FACE_MODEL_URL"

      - name: Tracking test on real photos
        run: |
          curl -fsSL -o test_person.jpg "$TEST_PHOTO"
          python tools/track_image.py test_person.jpg full --hands --face
          curl -fsSL -o portrait.jpg "https://storage.googleapis.com/mediapipe-assets/portrait.jpg"
          python tools/track_image.py portrait.jpg full --face --require-face

      - name: Unit tests
        run: |
          python tests/test_livelink.py
          python tests/test_extras_output.py

      - name: Build app and DMG
        run: bash installer/macos/build_mac.sh

      - name: Self-test of the built app
        run: |
          "dist/PGL Mocap.app/Contents/MacOS/PGL Mocap" --selftest; rc=$?
          f="dist/PGL Mocap.app/Contents/MacOS/pgl_mocap_selftest.txt"
          [ -f "$f" ] || f="$HOME/Library/Application Support/PGL Mocap/pgl_mocap_selftest.txt"
          cat "$f"
          exit $rc

      - name: GUI starts (window opens, no crash in 8 s)
        run: |
          "dist/PGL Mocap.app/Contents/MacOS/PGL Mocap" &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "GUI running"; kill $PID; else echo "GUI exited"; cat "$HOME/Library/Application Support/PGL Mocap/pgl_mocap.log" || true; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: PGL_Mocap_macOS
          path: PGL_Mocap_macOS.dmg

  # ------------------------------------------------------------------ macOS (Intel)
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mac-intel.txt pyinstaller==6.22.3

      - name: Download MediaPipe models
        run: |
          mkdir -p models
          for m in lite full heavy; do
            curl -fsSL -o "models/pose_landmarker_$m.task" "$MODEL_URL/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task"
          done
          curl -fsSL -o models/hand_landmarker.task "$HAND_MODEL_URL"
          curl -fsSL -o models/face_landmarker.task "$FACE_MODEL_URL"

      - name: Tracking test on real photos
        run: |
          curl -fsSL -o test_person.jpg "$TEST_PHOTO"
          python tools/track_image.py test_person.jpg full --hands --face
          curl -fsSL -o portrait.jpg "https://storage.googleapis.com/mediapipe-assets/portrait.jpg"
          python tools/track_image.py portrait.jpg full --face --require-face

      - name: Unit tests
        run: |
          python tests/test_livelink.py
          python tests/test_extras_output.py

      - name: Build app and DMG
        run: bash installer/macos/build_mac.sh PGL_Mocap_macOS_Intel.dmg

      - name: Self-test of the built app
        run: |
          "dist/PGL Mocap.app/Contents/MacOS/PGL Mocap" --selftest; rc=$?
          f="dist/PGL Mocap.app/Contents/MacOS/pgl_mocap_selftest.txt"
          [ -f "$f" ] || f="$HOME/Library/Application Support/PGL Mocap/pgl_mocap_selftest.txt"
          cat "$f"
          exit $rc

      - name: GUI starts (window opens, no crash in 8 s)
        run: |
          "dist/PGL Mocap.app/Contents/MacOS/PGL Mocap" &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "GUI running"; kill $PID; else echo "GUI exited"; cat "$HOME/Library/Application Support/PGL Mocap/pgl_mocap.log" || true; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: PGL_Mocap_macOS_Intel
          path: PGL_Mocap_macOS_Intel.dmg

  # ------------------------------------------------------------------ Release
  # Готовые архивы публикуются в Releases (главная страница репозитория → справа «Releases»)
  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, linux, macos, macos-intel, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Pack Unreal plugin
        run: |
          cd unreal
          zip -qr ../out/PGLMocapLiveLink_UE5_plugin.zip PGLMocapLiveLink build_plugin.bat

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pglmocap/__init__.py)
          tag="v${ver}-build${GITHUB_RUN_NUMBER}"
          notes=$(printf 'PGL Mocap %s (сборка %s).\n\n- **Windows (установщик, рекомендуется):** PGL_Mocap_Setup.exe — ярлыки, брандмауэр, удаление через «Приложения».\n- **Windows (portable):** PGL_Mocap_win64.zip — распакуйте и запустите `PGL Mocap.exe`.\n- **Linux:** PGL_Mocap_linux_x64.tar.gz — распакуйте и запустите `PGL Mocap` (Ubuntu 22.04+ и аналоги).\n- **macOS 13+ (Apple Silicon M1 и новее):** PGL_Mocap_macOS.dmg — перетащите PGL Mocap в «Программы».\n- **macOS 13+ (Intel):** PGL_Mocap_macOS_Intel.dmg.\n- **Android 8+:** PGL_Mocap_android.apk — установите на телефон.\n- **Unreal Engine 5.6+:** PGLMocapLiveLink_UE5_plugin.zip — плагин Live Link (исходники + build_plugin.bat).\n\nИнструкция — README.md внутри архива.' "$ver" "$GITHUB_RUN_NUMBER")
          # оставляем только свежий релиз: старые удаляются вместе с тегами
          for old in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release delete "$old" --cleanup-tag --yes
          done
          for old in $(git ls-remote --tags origin | sed -n 's|.*refs/tags/\(v[^^]*\)$|\1|p'); do
            git push origin --delete "$old" || true
          done
          gh release create "$tag" out/PGL_Mocap_Setup.exe out/PGL_Mocap_win64.zip out/PGL_Mocap_linux_x64.tar.gz out/PGL_Mocap_macOS.dmg out/PGL_Mocap_macOS_Intel.dmg out/PGL_Mocap_android.apk out/PGLMocapLiveLink_UE5_plugin.zip \
            --title "PGL Mocap $ver (сборка $GITHUB_RUN_NUMBER)" --notes "$notes" --latest --target "$GITHUB_SHA"
